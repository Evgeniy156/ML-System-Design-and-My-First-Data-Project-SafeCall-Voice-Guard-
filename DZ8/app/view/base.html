<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SafeCall Voice Guard{% endblock %}</title>
    <meta name="description" content="SafeCall — система детекции голосовых дипфейков в телефонных звонках">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sc-primary: #6366f1;
            --sc-danger: #ef4444;
            --sc-success: #22c55e;
            --sc-bg: #0f172a;
            --sc-surface: #1e293b;
            --sc-text: #e2e8f0;
            --sc-muted: #94a3b8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--sc-bg);
            color: var(--sc-text);
            min-height: 100vh;
        }
        .navbar {
            background: var(--sc-surface) !important;
            border-bottom: 1px solid rgba(99,102,241,0.2);
        }
        .navbar-brand { font-weight: 700; color: var(--sc-primary) !important; }
        .nav-link { color: var(--sc-muted) !important; }
        .nav-link:hover { color: var(--sc-text) !important; }
        .card {
            background: var(--sc-surface);
            border: 1px solid rgba(99,102,241,0.15);
            border-radius: 12px;
        }
        .btn-primary {
            background: var(--sc-primary);
            border: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-primary:hover { background: #4f46e5; }
        .badge-spoof { background: var(--sc-danger); }
        .badge-real { background: var(--sc-success); }
        .hero-gradient {
            background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(139,92,246,0.05));
            border-radius: 16px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🛡️ SafeCall</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Главная</a>
                <a class="nav-link" href="/api/predict/upload">Проверить</a>
                <a class="nav-link" href="/api/predict/history">История</a>
                <a class="nav-link" href="/auth/login">Войти</a>
                <a class="nav-link" href="/auth/logout">Выйти</a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3" style="color: var(--sc-muted); font-size: 0.85rem;">
        SafeCall Voice Guard v1.0 — XLSR-53 | Threshold 0.37 | F1 = 0.927
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
